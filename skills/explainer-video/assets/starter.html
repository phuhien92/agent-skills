<!doctype html>
<html lang="en">
<!-- explainer-video starter. One world, one camera, elements on twos (12 fps), every frame from SEEK(t).
     Setup: npm i gsap @fontsource/caveat @fontsource/oswald  (in this folder). Replace the demo beats at the bottom.
     Render: node ../scripts/render_frames.cjs index.html frames --fps 30 -->
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Hand;font-weight:700;src:url(node_modules/@fontsource/caveat/files/caveat-latin-700-normal.woff2)}
@font-face{font-family:Label;font-weight:700;src:url(node_modules/@fontsource/oswald/files/oswald-latin-700-normal.woff2)}
html,body{margin:0;background:#111;overflow:hidden}
#stage{position:relative;overflow:hidden;background:#fbf8ef}
#world{position:absolute;left:0;top:0;width:2400px;height:6000px;transform-origin:0 0;background-color:#fbf8ef;
  background-image:linear-gradient(#d3e3f0 2px,transparent 2px),linear-gradient(90deg,#e1ecf5 2px,transparent 2px);background-size:52px 52px}
.o{position:absolute;transform-origin:50% 50%}
.d svg{width:100%;height:100%;overflow:visible;display:block}
.label{background:#161514;color:#f2efe8;font:700 54px/1 Label;letter-spacing:.04em;padding:16px 26px 18px;white-space:nowrap}
.hw{position:absolute;font:700 92px/1.05 Hand;color:#24324f;white-space:nowrap}
.k{position:relative;z-index:2}
.hl{position:absolute;background:rgba(218,207,8,.88);mix-blend-mode:multiply;transform-origin:0 50%;border-radius:6px 14px 8px 12px}
svg.ink{position:absolute;overflow:visible;pointer-events:none}
svg.ink path{fill:none;stroke:#b8433f;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
svg.ink circle{fill:#b8433f}
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
const W = 1080, H = 1920;                             // 9:16; use 1920, 1080 for 16:9 and render with --size 1920x1080
const world = document.getElementById('world'), NS = 'http://www.w3.org/2000/svg';
Object.assign(document.getElementById('stage').style, {width: W + 'px', height: H + 'px'});
const camTL = gsap.timeline({paused: true}), el = gsap.timeline({paused: true});
const SFX = [], sfx = (t, kind) => SFX.push({t: +t.toFixed(3), kind});
let Z = 10;
/* ---------- camera: smooth ---------- */
const cam = {x: W / 2, y: H / 2, z: 1};
const apply = () => { world.style.transform = `translate(${W / 2 - cam.x * cam.z}px,${H / 2 - cam.y * cam.z}px) scale(${cam.z})`; };
const tail = t => 1 - Math.pow(1 - t, 3.2);                                     // long-tail settle
const cut = (t, x, y, z) => { camTL.set(cam, {x, y, z, onComplete: apply}, t); if (t > 0) sfx(t, 'cut'); };    // hard cut on a sentence break
const glide = (t, x, y, z, dur = .9, ease = 'sine.inOut') => { camTL.to(cam, {x, y, z, duration: dur, ease, onUpdate: apply}, t); sfx(t, 'move'); };
/* ---------- placing things (re-placed after fonts and images load) ---------- */
function add(cls, html, cx, cy, w = 0, rot = 0) {
  const d = document.createElement('div'); d.className = 'o ' + cls; d.innerHTML = html; if (w) d.style.width = w + 'px';
  d.style.zIndex = Z++; world.appendChild(d);
  d._place = () => { d.style.left = (cx - d.offsetWidth / 2) + 'px'; d.style.top = (cy - d.offsetHeight / 2) + 'px'; };
  d._place(); d._rot = rot; gsap.set(d, {rotation: rot, opacity: 0}); return d;
}
function label(text, cx, cy, rot = 0) {               // measured with its full text, typed in later
  const d = add('label', '', cx, cy, 0, rot); d.dataset.text = text; const base = d._place;
  d._place = () => { const cur = d.textContent; d.textContent = text; base(); d.textContent = cur; }; d._place(); return d;
}
/* ---------- element layer: on twos ---------- */
const show = (d, t, s = 'tap') => { el.set(d, {opacity: 1}, t); if (s) sfx(t, s); };
function slideIn(d, t, {dx = 0, dy = -380, rot = 12, dur = .55} = {}) {
  el.fromTo(d, {opacity: 0, x: dx, y: dy, rotation: d._rot + rot}, {opacity: 1, x: 0, y: 0, rotation: d._rot, duration: dur, ease: 'quart.out', immediateRender: false}, t); sfx(t, 'slide');
}
function type(d, t, cps = 13) {
  const s = d.dataset.text, o = {n: 0}; el.set(d, {opacity: 1}, t);
  el.to(o, {n: s.length, duration: s.length / cps, ease: 'none', onUpdate() { d.textContent = s.slice(0, Math.round(o.n)) || '​'; }}, t);
  sfx(t, 'type:' + (s.length / cps).toFixed(2));
}
function inkSvg(dPath, box) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('class', 'ink'); Object.assign(s.style, {left: box[0] + 'px', top: box[1] + 'px', zIndex: Z++});
  s.setAttribute('width', box[2]); s.setAttribute('height', box[3]); s.innerHTML = `<path d="${dPath}"/>`; world.appendChild(s);
  const p = s.querySelector('path'); s._p = p; s._L = p.getTotalLength(); p.style.strokeDasharray = s._L; p.style.strokeDashoffset = s._L; return s;
}
function ring(x, y, rx, ry) {                          // one stroke, ends overlap, never closes
  const bw = rx * 2.4 + 80, bh = ry * 2.4 + 80, pts = [], a0 = -2.3, span = Math.PI * 2 + .55;
  for (let i = 0; i <= 44; i++) { const a = a0 + span * i / 44, w = 1 + .05 * Math.sin(a * 3 + 1) + i / 44 * .07; pts.push([bw / 2 + Math.cos(a) * rx * w, bh / 2 + Math.sin(a) * ry * w]); }
  return inkSvg('M' + pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join(' L'), [x - bw / 2, y - bh / 2, bw, bh]);
}
function line(x0, y0, x1, y1, sag = 0) {
  const minx = Math.min(x0, x1) - 60, miny = Math.min(y0, y1) - 60 - Math.abs(sag);
  return inkSvg(`M${x0 - minx} ${y0 - miny} Q${(x0 + x1) / 2 - minx} ${(y0 + y1) / 2 + sag - miny} ${x1 - minx} ${y1 - miny}`, [minx, miny, Math.abs(x1 - x0) + 120, Math.abs(y1 - y0) + 120 + Math.abs(sag) * 2]);
}
function draw(s, t, dur = .65, dot = false) {
  const o = {v: 0}; let c = null; if (dot) { c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 13); c.style.opacity = 0; s.appendChild(c); }
  el.to(o, {v: 1, duration: dur, ease: 'power1.inOut', onUpdate() { s._p.style.strokeDashoffset = s._L * (1 - o.v);
    if (c) { const q = s._p.getPointAtLength(s._L * o.v); c.setAttribute('cx', q.x); c.setAttribute('cy', q.y); c.style.opacity = o.v > 0 ? 1 : 0; } }}, t);
  sfx(t, 'pen:' + dur.toFixed(2));
}
function spanBox(sp) { const w = world.getBoundingClientRect(), r = sp.getBoundingClientRect(); return [r.left - w.left, r.top - w.top, r.width, r.height]; }
function hlSpan(sp, t, dur = .8) {                     // highlighter measured from the words themselves
  const [x, y, w, h] = spanBox(sp), d = document.createElement('div'); d.className = 'hl';
  Object.assign(d.style, {left: x - 10 + 'px', top: y + h * .18 + 'px', width: w + 20 + 'px', height: h * .7 + 'px', zIndex: +sp.closest('.o').style.zIndex - 1});
  world.appendChild(d); gsap.set(d, {scaleX: 0}); el.to(d, {scaleX: 1, duration: dur, ease: 'none'}, t); sfx(t, 'marker:' + dur.toFixed(2));
}
/* ---------- an SVG that draws itself, then colours in ---------- */
const DRAWS = [], STROKES = [];   // STROKES: pen-down [start, end] pairs, for a synthesised scratch
function schedule(d, t0, dur, colour = .25) {
  const items = [...d.querySelectorAll('path,rect,circle,ellipse,line,polyline,polygon')].map(s => {
    const cs = getComputedStyle(s), stroked = cs.stroke !== 'none' && parseFloat(cs.strokeWidth) > 0;
    const m = s.getScreenCTM(), L = s.getTotalLength(); return {s, stroked, len: stroked ? Math.max(8, L * Math.hypot(m.a, m.b)) : 0, fill: cs.fill !== 'none', fo: +cs.fillOpacity};
  });
  const total = items.reduce((a, i) => a + i.len, 0) || 1, outline = dur * (1 - colour * .5); let t = t0;
  for (const it of items) {
    if (it.stroked) { it.s.setAttribute('pathLength', 1); it.s.style.strokeDasharray = '1 1.01'; it.a = t; it.b = t + Math.max(.04, outline * it.len / total); t = it.b; STROKES.push([+it.a.toFixed(3), +it.b.toFixed(3)]); }
    else { it.a = it.b = t; }
    it.fa = it.b + .05; it.fb = it.fa + colour; if (it.fill) it.s.style.fillOpacity = 0;
  }
  DRAWS.push(items); sfx(t0, 'draw:' + dur.toFixed(2));
}
function renderDraws(t) { for (const items of DRAWS) for (const it of items) {
  if (it.stroked) { const p = Math.min(1, Math.max(0, (t - it.a) / (it.b - it.a))); it.s.style.strokeDashoffset = 1 - p; it.s.style.visibility = p > 0 ? 'visible' : 'hidden'; }
  if (it.fill) it.s.style.fillOpacity = Math.min(1, Math.max(0, (t - it.fa) / (it.fb - it.fa))) * it.fo; } }
/* ---------- handwriting ---------- */
const WRITES = [];
function write(text, x, y, t0, size = 92, cps = 15) {
  const d = document.createElement('div'); d.className = 'hw'; d.textContent = text; Object.assign(d.style, {left: x + 'px', top: y + 'px', fontSize: size + 'px', zIndex: Z++});
  world.appendChild(d); WRITES.push({d, a: t0, b: t0 + text.length / cps}); STROKES.push([t0, +(t0 + text.length / cps).toFixed(3)]); sfx(t0, 'write:' + (text.length / cps).toFixed(2));
}
function renderWrites(t) { for (const w of WRITES) { const p = Math.min(1, Math.max(0, (t - w.a) / (w.b - w.a))); w.d.style.clipPath = `inset(-30px ${(1 - p) * 100}% -30px -30px)`; w.d.style.visibility = p > 0 ? 'visible' : 'hidden'; } }

async function main() {
  /* ======== 1. build the world (replace the demo) ======== */
  const doodle = add('d', `<svg viewBox="0 0 200 200"><g stroke="#1b1b1f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 170 Q100 150 160 170" fill="none"/><rect x="70" y="60" width="60" height="100" rx="8" fill="#fbbf24"/><path d="M70 60 L100 20 L130 60 Z" fill="#f5d0a0"/>
    <circle cx="88" cy="95" r="5" fill="#1b1b1f"/><circle cx="112" cy="95" r="5" fill="#1b1b1f"/><path d="M88 118 Q100 128 112 118" fill="none"/></g></svg>`, 540, 900, 700);
  const head = add('hw', 'a <span class="k" id="k1">big idea</span>, drawn', 540, 1450);
  const lb = label('BEAT ONE', 300, 400, -2);
  const r1 = ring(540, 760, 160, 120);
  /* ======== 2. wait for fonts and images, re-place, then measure ======== */
  await document.fonts.ready; await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  document.querySelectorAll('.o').forEach(d => d._place && d._place());
  /* ======== 3. the timeline, keyed to narration times (offset + sentence start) ======== */
  cut(0, W / 2, H / 2, 1.0);
  type(lb, .7);
  gsap.set(doodle, {opacity: 1}); schedule(doodle, 1.2, 2.4);
  show(head, 3.8, null); hlSpan(document.getElementById('k1'), 4.2, .8);
  draw(r1, 5.2, .7);
  glide(6.0, 540, 1100, 1.25, 1.0, tail);
  const END = 8;
  camTL.set({}, {}, END); el.set({}, {}, END);
  window.FILM = {END, SFX, STROKES, ready: true, SEEK(t) { camTL.time(t, false); const q = Math.floor(t * 12 + 1e-6) / 12; el.time(q, false); renderDraws(q); renderWrites(q); apply(); }};
  window.FILM.SEEK(0);
}
main();
</script>
</body>
</html>
