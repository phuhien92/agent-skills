<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800" role="img" aria-label="agent-skills: Agent skill blocks for software factories. Practice rounds you have cleared, with the probes you have not heard yet still open.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#011C16"/>
      <stop offset="0.55" stop-color="#022C22"/>
      <stop offset="1" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#022C22"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <!-- flat-top hexagon, radius 112, centered on 0,0 -->
    <polygon id="hex" points="112,0 56,97 -56,97 -112,0 -56,-97 56,-97"/>
    <g id="check">
      <circle r="21" fill="none" stroke="#ECFDF5" stroke-width="3.5"/>
      <path d="M-9 1 L-2 8 L10 -6" fill="none" stroke="#ECFDF5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1600" height="800" fill="url(#bg)"/>

  <!-- wordmark -->
  <g transform="translate(96 132) scale(0.5)">
    <rect width="128" height="128" rx="28" fill="url(#tile)" stroke="#10B981" stroke-opacity="0.5"/>
    <rect x="34" y="26" width="60" height="44" rx="9" fill="#A7F3D0" opacity="0.35"/>
    <rect x="28" y="38" width="72" height="52" rx="10" fill="#A7F3D0" opacity="0.6"/>
    <rect x="22" y="52" width="84" height="54" rx="11" fill="#ECFDF5"/>
    <path d="M60 96 L76 62" stroke="#047857" stroke-width="9" stroke-linecap="round"/>
    <circle cx="90" cy="92" r="6" fill="#FBBF24"/>
  </g>
  <text x="176" y="186" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-1">agent<tspan fill="#6EE7B7" font-weight="600">-skills</tspan></text>

  <!-- slogan -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">
    <text x="96" y="320">Agent skill blocks</text>
    <text x="96" y="398">for software</text>
    <text x="96" y="476">factories<tspan fill="#FBBF24">.</tspan></text>
  </g>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" fill="#A7F3D0">
    <text x="98" y="544">Snap in the block you need. Each one stands on its own.</text>
    <text x="98" y="578">Sharper engineers, not just faster output.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" fill="#ECFDF5">
    <rect x="98" y="616" width="96" height="34" rx="17" fill="#065F46"/><text x="118" y="639">probe</text>
    <text x="204" y="639" fill="#6EE7B7">→</text>
    <rect x="230" y="616" width="88" height="34" rx="17" fill="#065F46"/><text x="250" y="639">hold</text>
    <text x="328" y="639" fill="#6EE7B7">→</text>
    <rect x="354" y="616" width="88" height="34" rx="17" fill="#065F46"/><text x="374" y="639">next</text>
  </g>

  <!-- cleared rounds: the prep loop runs Recall, Story, Design; Think stands alone -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(900 250)">
      <use href="#hex" fill="#065F46" stroke="#34D399" stroke-opacity="0.6" stroke-width="3"/>
      <use href="#check" y="-38"/>
      <text y="30" font-size="34" font-weight="700" fill="#FFFFFF">Recall</text>
    </g>
    <g transform="translate(1068 347)">
      <use href="#hex" fill="#047857" stroke="#34D399" stroke-opacity="0.6" stroke-width="3"/>
      <use href="#check" y="-38"/>
      <text y="30" font-size="34" font-weight="700" fill="#FFFFFF">Story</text>
    </g>
    <g transform="translate(1236 250)">
      <use href="#hex" fill="#0F766E" stroke="#34D399" stroke-opacity="0.6" stroke-width="3"/>
      <use href="#check" y="-38"/>
      <text y="30" font-size="34" font-weight="700" fill="#FFFFFF">Design</text>
    </g>
    <g transform="translate(1236 444)">
      <use href="#hex" fill="#115E59" stroke="#34D399" stroke-opacity="0.6" stroke-width="3"/>
      <use href="#check" y="-38"/>
      <text y="30" font-size="34" font-weight="700" fill="#FFFFFF">Think</text>
    </g>
  </g>

  <!-- probes not faced yet -->
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(1404 347)">
      <use href="#hex" fill="#A7F3D0" fill-opacity="0.05" stroke="#A7F3D0" stroke-opacity="0.4" stroke-width="2.5" stroke-dasharray="10 9"/>
      <text y="22" font-size="64" font-weight="700" fill="#ECFDF5" fill-opacity="0.4">?</text>
    </g>
    <g transform="translate(1404 541)">
      <use href="#hex" fill="#A7F3D0" fill-opacity="0.05" stroke="#A7F3D0" stroke-opacity="0.28" stroke-width="2.5" stroke-dasharray="10 9"/>
      <text y="22" font-size="64" font-weight="700" fill="#ECFDF5" fill-opacity="0.28">?</text>
    </g>
    <g transform="translate(1068 541)">
      <use href="#hex" fill="#A7F3D0" fill-opacity="0.05" stroke="#A7F3D0" stroke-opacity="0.28" stroke-width="2.5" stroke-dasharray="10 9"/>
      <text y="22" font-size="64" font-weight="700" fill="#ECFDF5" fill-opacity="0.28">?</text>
    </g>
  </g>

  <!-- held answers between rounds -->
  <g fill="#FBBF24" stroke="#022C22" stroke-width="3">
    <circle cx="984" cy="298" r="9"/>
    <circle cx="1152" cy="298" r="9"/>
  </g>
  <!-- the next probe, not answered yet -->
  <circle cx="1320" cy="298" r="11" fill="#022C22" stroke="#FBBF24" stroke-width="3" stroke-dasharray="5 4"/>
  <text x="1404" y="700" text-anchor="middle" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-style="italic" fill="#A7F3D0" fill-opacity="0.85">the next probe you haven't heard yet</text>
</svg>
